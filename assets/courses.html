<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibress LMS — Course Management</title>
<style>
:root{
  color-scheme: light dark;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --bg: Canvas;
  --text: CanvasText;
  --border: #8888;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --success: #16a34a;
  --badge-draft-bg: #fef3c7;
  --badge-draft-text: #92400e;
  --badge-pub-bg: #dcfce7;
  --badge-pub-text: #166534;
}
@media (prefers-color-scheme: dark) {
  :root {
    --badge-draft-bg: #78350f;
    --badge-draft-text: #fef3c7;
    --badge-pub-bg: #14532d;
    --badge-pub-text: #dcfce7;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 1.25rem; max-width: 60rem; color: var(--text); background: var(--bg); line-height: 1.5; }
header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
h1, h2, h3 { margin: 0 0 0.5rem 0; }
.note { font-size: 0.85rem; opacity: 0.85; margin: 0.25rem 0 1rem 0; }
button, input, textarea, select { font: inherit; padding: 0.55rem 0.85rem; border-radius: 0.375rem; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
button { cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 0.4rem; }
button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
button.primary:hover:not(:disabled) { background: var(--primary-hover); }
button.success { background: var(--success); color: #fff; border-color: var(--success); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
.badge { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 0.2rem 0.5rem; border-radius: 9999px; }
.badge.draft { background: var(--badge-draft-bg); color: var(--badge-draft-text); }
.badge.published { background: var(--badge-pub-bg); color: var(--badge-pub-text); }
.actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-block: 1rem; }
#status { min-height: 1.5em; overflow-wrap: anywhere; font-weight: 500; }
fieldset { border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; display: grid; gap: 0.75rem; margin-bottom: 1rem; }
label { display: grid; gap: 0.25rem; font-size: 0.9rem; }
textarea { min-height: 4.5rem; resize: vertical; }
.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
.search-box { flex: 1; min-width: 15rem; }
.courses-table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; font-size: 0.9rem; }
.courses-table th, .courses-table td { padding: 0.75rem; border-bottom: 1px solid var(--border); text-align: start; }
.courses-table th { font-weight: 600; background: rgba(128,128,128,0.06); }
.courses-table tr:hover td { background: rgba(128,128,128,0.04); }
.empty-state { text-align: center; padding: 2.5rem 1rem; border: 1px dashed var(--border); border-radius: 0.5rem; margin: 1rem 0; }
</style></head><body>
<header>
  <div>
    <h1 data-en="Courses" data-ar="الدورات">Courses</h1>
    <p class="note" data-en="Staff course authoring, draft revision, and publication workflow."
      data-ar="إدارة الدورات وتأليف المسودات ونشرها للموظفين المصرح لهم.">
      Staff course authoring, draft revision, and publication workflow.
    </p>
  </div>
  <div id="header-actions">
    <button type="button" class="primary" id="btn-create-view" data-en="+ Create Course" data-ar="+ دورة جديدة">+ Create Course</button>
  </div>
</header>

<!-- View 1: Courses Listing -->
<section id="list-view">
  <div class="toolbar">
    <input type="search" id="search-input" class="search-box" placeholder="Search courses…" data-en-placeholder="Search courses…" data-ar-placeholder="ابحث في الدورات…">
    <div class="filter-group">
      <select id="status-filter">
        <option value="all" data-en="All statuses" data-ar="جميع الحالات">All statuses</option>
        <option value="draft" data-en="Drafts only" data-ar="المسودات فقط">Drafts only</option>
        <option value="published" data-en="Published only" data-ar="المنشورة فقط">Published only</option>
      </select>
    </div>
  </div>

  <div id="table-container">
    <table class="courses-table" id="courses-table" aria-label="Courses">
      <thead>
        <tr>
          <th data-en="ID" data-ar="المعرّف">ID</th>
          <th data-en="Title" data-ar="العنوان">Title</th>
          <th data-en="Status" data-ar="الحالة">Status</th>
          <th data-en="Version" data-ar="الإصدار">Version</th>
          <th data-en="Action" data-ar="الإجراء">Action</th>
        </tr>
      </thead>
      <tbody id="courses-tbody">
        <!-- Rendered dynamically -->
      </tbody>
    </table>
    <div id="empty-state" class="empty-state" style="display: none;">
      <p style="font-weight: 600;" data-en="No courses found" data-ar="لا توجد دورات">No courses found</p>
      <p class="note" data-en="Click '+ Create Course' above to author your first course." data-ar="انقر على '+ دورة جديدة' بالأعلى للبدء بتأليف دورتك الأولى.">
        Click '+ Create Course' above to author your first course.
      </p>
    </div>
  </div>
</section>

<!-- View 2: Course Editor -->
<section id="editor-view" style="display: none;">
  <div style="margin-bottom: 1rem;">
    <button type="button" id="btn-back" data-en="← Back to Courses" data-ar="← العودة إلى الدورات">← Back to Courses</button>
  </div>

  <form id="editor" autocomplete="off">
    <fieldset id="fields">
      <legend id="form-legend" data-en="Course Details" data-ar="بيانات الدورة">Course Details</legend>
      <label>
        <span data-en="Course ID (lowercase letters, numbers, dashes)" data-ar="معرّف الدورة (أحرف لاتينية صغيرة وأرقام وشرطات)">Course ID</span>
        <input id="courseId" required maxlength="64" pattern="[a-z][a-z0-9-]{1,63}" dir="ltr">
      </label>
      <label>
        <span data-en="English title" data-ar="العنوان بالإنجليزية">English title</span>
        <input id="title_en" maxlength="180" dir="auto">
      </label>
      <label>
        <span data-en="Arabic title" data-ar="العنوان بالعربية">Arabic title</span>
        <input id="title_ar" maxlength="180" dir="auto">
      </label>
      <label>
        <span data-en="English description" data-ar="الوصف بالإنجليزية">English description</span>
        <textarea id="summary_en" maxlength="1000" dir="auto"></textarea>
      </label>
      <label>
        <span data-en="Arabic description" data-ar="الوصف بالعربية">Arabic description</span>
        <textarea id="summary_ar" maxlength="1000" dir="auto"></textarea>
      </label>
      <label>
        <span data-en="English lesson title" data-ar="عنوان الدرس بالإنجليزية">English lesson title</span>
        <input id="lesson_title_en" maxlength="180" dir="auto">
      </label>
      <label>
        <span data-en="Arabic lesson title" data-ar="عنوان الدرس بالعربية">Arabic lesson title</span>
        <input id="lesson_title_ar" maxlength="180" dir="auto">
      </label>
      <label>
        <span data-en="English protected lesson body" data-ar="نص الدرس المحمي بالإنجليزية">English protected lesson body</span>
        <textarea id="lesson_body_en" maxlength="4096" dir="auto"></textarea>
      </label>
      <label>
        <span data-en="Arabic protected lesson body" data-ar="نص الدرس المحمي بالعربية">Arabic protected lesson body</span>
        <textarea id="lesson_body_ar" maxlength="4096" dir="auto"></textarea>
      </label>
    </fieldset>

    <div class="actions">
      <button type="button" id="create" class="primary" data-en="Create draft" data-ar="إنشاء مسودة">Create draft</button>
      <button type="button" id="save" data-en="Save draft" data-ar="حفظ المسودة">Save draft</button>
      <button type="button" id="publish" class="success" data-en="Publish reviewed draft" data-ar="نشر المسودة بعد المراجعة">Publish reviewed draft</button>
    </div>
  </form>
</section>

<p id="status" role="status" aria-live="polite"></p>

<script>
(function () {
  'use strict';
  let port = null, version = 0, current = '', state = '', busy = false, sequence = 0;
  let allCourses = [];
  const waiting = new Map();
  const keys = ['title_en','title_ar','summary_en','summary_ar',
    'lesson_title_en','lesson_title_ar','lesson_body_en','lesson_body_ar'];
  const el = (id) => document.getElementById(id);
  const messages = {
    en: { connecting:'Connecting to Vibress…', ready:'Ready', failed:'Request unavailable',
      empty:'No courses registered', saved:'Draft saved', created:'Draft created',
      published:'Course published and catalog-ready', conflict:'Conflict: reload this editor',
      invalid:'Check input and lesson translations', notReady:'Save and complete both language lessons first',
      immutable:'Published courses cannot be edited by this release' },
    ar: { connecting:'جارٍ الاتصال بفيبرس…', ready:'جاهز', failed:'الطلب غير متاح',
      empty:'لا توجد دورات مسجلة', saved:'تم حفظ المسودة', created:'تم إنشاء المسودة',
      published:'تم نشر الدورة وأصبحت متاحة في الفهرس', conflict:'تعارض: أعد تحميل المحرر',
      invalid:'تحقق من الحقول وترجمات الدرس', notReady:'احفظ المسودة وأكمل الدرس باللغتين أولًا',
      immutable:'لا يمكن تعديل الدورات المنشورة بهذا الإصدار' },
  };
  let lang = 'en';
  function announce(msg) { el('status').textContent = msg; }

  function switchView(view) {
    if (view === 'editor') {
      el('list-view').style.display = 'none';
      el('editor-view').style.display = 'block';
    } else {
      el('list-view').style.display = 'block';
      el('editor-view').style.display = 'none';
    }
  }

  function renderList() {
    const tbody = el('courses-tbody');
    tbody.replaceChildren();
    const q = (el('search-input').value || '').trim().toLowerCase();
    const filter = el('status-filter').value;

    const filtered = allCourses.filter(c => {
      if (filter !== 'all' && c.status !== filter) return false;
      if (!q) return true;
      const title = lang === 'ar' ? (c.title_ar || c.title_en) : (c.title_en || c.title_ar);
      return c.id.toLowerCase().includes(q) || (title && title.toLowerCase().includes(q));
    });

    if (filtered.length === 0) {
      el('courses-table').style.display = 'none';
      el('empty-state').style.display = 'block';
      return;
    }

    el('courses-table').style.display = 'table';
    el('empty-state').style.display = 'none';

    filtered.forEach(c => {
      const tr = document.createElement('tr');
      const isPub = c.status === 'published';
      const statusLabel = isPub ? (lang === 'ar' ? 'منشورة' : 'Published') : (lang === 'ar' ? 'مسودة' : 'Draft');
      const titleText = (lang === 'ar' ? (c.title_ar || c.title_en) : (c.title_en || c.title_ar)) || c.id;
      
      // Persisted course metadata is untrusted. Build nodes rather than
      // interpolating titles/IDs into HTML or event-handler attributes.
      const idCell = document.createElement('td');
      idCell.dir = 'ltr';
      idCell.style.fontWeight = '600';
      idCell.textContent = c.id;
      const titleCell = document.createElement('td');
      titleCell.dir = 'auto';
      titleCell.textContent = titleText;
      const statusCell = document.createElement('td');
      const badge = document.createElement('span');
      badge.className = 'badge ' + (isPub ? 'published' : 'draft');
      badge.textContent = statusLabel;
      statusCell.appendChild(badge);
      const versionCell = document.createElement('td');
      versionCell.textContent = 'v' + String(c.version);
      const actionCell = document.createElement('td');
      const actionButton = document.createElement('button');
      actionButton.type = 'button';
      actionButton.dataset.editId = c.id;
      actionButton.className = 'edit-btn';
      actionButton.textContent = lang === 'ar' ? 'تعديل' : 'Edit';
      actionCell.appendChild(actionButton);
      tr.append(idCell, titleCell, statusCell, versionCell, actionCell);
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('[data-edit-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-edit-id');
        const course = allCourses.find(c => c.id === id);
        if (course) selectCourse(course);
      });
    });
  }

  function selectCourse(course) {
    current = course.id;
    version = course.version;
    state = course.status;
    el('courseId').value = course.id;
    for (const key of keys) el(key).value = course[key] || '';
    controls();
    switchView('editor');
  }

  function newCourseForm() {
    current = '';
    version = 0;
    state = '';
    el('courseId').value = '';
    for (const key of keys) el(key).value = '';
    controls();
    switchView('editor');
  }

  function controls() {
    const editable = !busy && Boolean(port) && state !== 'published';
    el('fields').disabled = !editable;
    el('courseId').readOnly = version > 0;
    el('create').disabled = !editable || version !== 0;
    el('save').disabled = !editable || version === 0;
    el('publish').disabled = !editable || version === 0;
  }

  function request(type, body) {
    if (!port) return Promise.reject(new Error('not connected'));
    const requestId = 'lms_' + (++sequence);
    return new Promise((resolve, reject) => {
      waiting.set(requestId, { resolve, reject });
      port.postMessage({ type, version:1, requestId, ...(body ? { body } : {}) });
    });
  }

  async function read() {
    busy = true; controls();
    try {
      const result = await request('vibress:extension:read');
      if (result.outcome === 'available' || result.total > 0) {
        if (result.coursesJson) {
          try { allCourses = JSON.parse(result.coursesJson); } catch { allCourses = []; }
        }
        if (allCourses.length === 0 && result.courseId) {
          allCourses = [{
            id: result.courseId, version: result.version, status: result.status,
            ...Object.fromEntries(keys.map(k => [k, result[k] || '']))
          }];
        }
        renderList();
        announce(messages[lang].ready);
      } else {
        allCourses = [];
        renderList();
        announce(messages[lang].empty);
      }
    } catch { announce(messages[lang].failed); }
    finally { busy = false; controls(); }
  }

  async function write(operation) {
    if (busy) return;
    const form = el('editor');
    if (!form.reportValidity()) return;
    busy = true; controls();
    try {
      const body = { operation, courseId: el('courseId').value, expectedVersion: version };
      for (const key of keys) body[key] = el(key).value;
      const result = await request('vibress:extension:write', body);
      if (['created','saved','published'].includes(result.outcome)) {
        version = result.version; state = result.status; current = result.courseId;
        announce(messages[lang][result.outcome]);
        await read();
      } else {
        announce(messages[lang][result.outcome === 'not-ready' ? 'notReady' : result.outcome] || messages[lang].failed);
      }
    } catch { announce(messages[lang].failed); }
    finally { busy = false; controls(); }
  }

  el('create').addEventListener('click', () => { void write('create'); });
  el('save').addEventListener('click', () => { void write('save'); });
  el('publish').addEventListener('click', () => { void write('publish'); });
  el('btn-create-view').addEventListener('click', newCourseForm);
  el('btn-back').addEventListener('click', () => { switchView('list'); });
  el('search-input').addEventListener('input', renderList);
  el('status-filter').addEventListener('change', renderList);

  function applyLocale(newLang) {
    lang = newLang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-' + lang + ']').forEach(node => {
      node.textContent = node.getAttribute('data-' + lang) || '';
    });
    document.querySelectorAll('[data-' + lang + '-placeholder]').forEach(node => {
      node.setAttribute('placeholder', node.getAttribute('data-' + lang + '-placeholder') || '');
    });
    renderList();
  }

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent || event.data?.type !== 'vibress:extension:connect' ||
      event.data.version !== 1 || port || !event.ports?.length) return;
    port = event.ports[0];
    const initialLang = typeof event.data.locale === 'string' && event.data.locale.startsWith('ar') ? 'ar' : 'en';
    applyLocale(initialLang);
    port.onmessage = ({ data }) => {
      if (data?.type !== 'vibress:extension:response' || data.version !== 1) return;
      const pending = waiting.get(data.requestId);
      if (!pending) return;
      waiting.delete(data.requestId);
      if (data.ok === true) pending.resolve(data.data);
      else pending.reject(new Error('denied'));
    };
    void read();
  });

  window.addEventListener('pagehide', () => {
    if (port) port.close();
    port = null;
    for (const item of waiting.values()) item.reject(new Error('closed'));
    waiting.clear();
  });
  announce(messages.en.connecting);
}());
</script></body></html>
