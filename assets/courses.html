<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibress LMS — Course Authoring</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}
body{margin:0;padding:1rem;max-width:50rem;color:CanvasText;background:Canvas}
fieldset{border:1px solid #8888;border-radius:.5rem;padding:1rem;display:grid;gap:.75rem}
label{display:grid;gap:.25rem;font-size:.92rem}
input,textarea,button{font:inherit;padding:.55rem;border-radius:.35rem;border:1px solid #888}
textarea{min-height:4rem;resize:vertical}
button{cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid Highlight;outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-block:1rem}
#status{min-height:1.6em;overflow-wrap:anywhere}
.note{font-size:.85rem;opacity:.85}
</style></head><body>
<h1 data-en="Courses" data-ar="الدورات">Courses</h1>
<p class="note" data-en="Staff-only draft and publish workflow. One required bilingual text lesson per course. Publishing makes this course available in the public catalog for Member enrollment."
 data-ar="إدارة المسودات والنشر للموظفين فقط. درس نصي واحد بالعربية والإنجليزية لكل دورة. النشر يضيف الدورة إلى الفهرس العام ويتيح تسجيل الأعضاء.">
 Staff-only draft and publish workflow. One required bilingual text lesson per course. Publishing does not yet expose a public catalog.</p>
<form id="editor" autocomplete="off">
<fieldset disabled id="fields">
<legend data-en="Course draft" data-ar="مسودة الدورة">Course draft</legend>
<label><span data-en="Course ID (lowercase letters, numbers, dashes)" data-ar="معرّف الدورة (أحرف لاتينية صغيرة وأرقام وشرطات)">Course ID</span>
<input id="courseId" required maxlength="64" pattern="[a-z][a-z0-9-]{1,63}" dir="ltr"></label>
<label><span data-en="English title" data-ar="العنوان بالإنجليزية">English title</span><input id="title_en" maxlength="180" dir="auto"></label>
<label><span data-en="العنوان بالعربية" data-ar="العنوان بالعربية">Arabic title</span><input id="title_ar" maxlength="180" dir="auto"></label>
<label><span data-en="English description" data-ar="الوصف بالإنجليزية">English description</span><textarea id="summary_en" maxlength="1000" dir="auto"></textarea></label>
<label><span data-en="Arabic description" data-ar="الوصف بالعربية">Arabic description</span><textarea id="summary_ar" maxlength="1000" dir="auto"></textarea></label>
<label><span data-en="English lesson title" data-ar="عنوان الدرس بالإنجليزية">English lesson title</span><input id="lesson_title_en" maxlength="180" dir="auto"></label>
<label><span data-en="Arabic lesson title" data-ar="عنوان الدرس بالعربية">Arabic lesson title</span><input id="lesson_title_ar" maxlength="180" dir="auto"></label>
<label><span data-en="English protected lesson body" data-ar="نص الدرس المحمي بالإنجليزية">English protected lesson body</span><textarea id="lesson_body_en" maxlength="4096" dir="auto"></textarea></label>
<label><span data-en="Arabic protected lesson body" data-ar="نص الدرس المحمي بالعربية">Arabic protected lesson body</span><textarea id="lesson_body_ar" maxlength="4096" dir="auto"></textarea></label>
</fieldset>
<div class="actions">
<button type="button" id="create" disabled data-en="Create draft" data-ar="إنشاء مسودة">Create draft</button>
<button type="button" id="save" disabled data-en="Save draft" data-ar="حفظ المسودة">Save draft</button>
<button type="button" id="publish" disabled data-en="Publish reviewed draft" data-ar="نشر المسودة بعد المراجعة">Publish reviewed draft</button>
</div></form>
<p class="note" data-en="Every write requires confirmation in the Vibress Host. Content is never sent to third-party services."
 data-ar="تتطلب كل عملية كتابة موافقة من Vibress. لن يُرسل المحتوى إلى خدمات خارجية.">
 Every write requires confirmation in the Vibress Host. Content is never sent to third-party services.</p>
<p id="status" role="status" aria-live="polite"></p>
<script>
(function () {
  'use strict';
  let port = null, version = 0, current = '', state = '', busy = false, sequence = 0;
  const waiting = new Map();
  const keys = ['title_en','title_ar','summary_en','summary_ar',
    'lesson_title_en','lesson_title_ar','lesson_body_en','lesson_body_ar'];
  const el = (id) => document.getElementById(id);
  const messages = {
    en: { connecting:'Connecting to Vibress…', ready:'Ready', failed:'Request unavailable',
      empty:'No course registered here', saved:'Draft saved', created:'Draft created',
      published:'Course published and catalog-ready', conflict:'Conflict: reload this editor',
      invalid:'Check input and lesson translations', notReady:'Save and complete both language lessons first',
      immutable:'Published courses cannot be edited by this release' },
    ar: { connecting:'جارٍ الاتصال بفيبرس…', ready:'جاهز', failed:'الطلب غير متاح',
      empty:'لا توجد دورة هنا', saved:'تم حفظ المسودة', created:'تم إنشاء المسودة',
      published:'تم نشر الدورة وأصبحت متاحة في الفهرس', conflict:'تعارض: أعد تحميل المحرر',
      invalid:'تحقق من الحقول وترجمات الدرس', notReady:'احفظ المسودة وأكمل الدرس باللغتين أولًا',
      immutable:'لا يمكن تعديل الدورات المنشورة بهذا الإصدار' },
  };
  let lang = 'en';
  function announce(msg) { el('status').textContent = msg; }
  function controls() {
    const editable = !busy && Boolean(port) && state !== 'published';
    el('fields').disabled = !editable;
    // A course ID is its stable, locale-neutral identity, not editable metadata.
    el('courseId').readOnly = version > 0;
    el('create').disabled = !editable || version !== 0;
    el('save').disabled = !editable || version === 0;
    el('publish').disabled = !editable || version === 0;
  }
  function request(type, body) {
    if (!port) return Promise.reject(new Error('not connected'));
    const requestId = 'lms_' + (++sequence);
    return new Promise((resolve, reject) => {
      waiting.set(requestId, { resolve, reject });
      port.postMessage({ type, version:1, requestId, ...(body ? { body } : {}) });
    });
  }
  async function read() {
    busy = true; controls();
    try {
      const result = await request('vibress:extension:read');
      if (result.outcome === 'available') {
        current = result.courseId;
        version = result.version;
        state = result.status;
        el('courseId').value = current;
        for (const key of keys) el(key).value = result[key] || '';
        announce(messages[lang].ready);
      } else {
        version = 0; state = ''; current = '';
        announce(messages[lang].empty);
      }
    } catch { announce(messages[lang].failed); }
    finally { busy = false; controls(); }
  }
  async function write(operation) {
    if (busy) return;
    const form = el('editor');
    if (!form.reportValidity()) return;
    busy = true; controls();
    try {
      const body = { operation, courseId: el('courseId').value, expectedVersion: version };
      for (const key of keys) body[key] = el(key).value;
      const result = await request('vibress:extension:write', body);
      if (['created','saved','published'].includes(result.outcome)) {
        version = result.version; state = result.status; current = result.courseId;
        announce(messages[lang][result.outcome]);
      } else {
        announce(messages[lang][result.outcome === 'not-ready' ? 'notReady' : result.outcome] || messages[lang].failed);
      }
    } catch { announce(messages[lang].failed); }
    finally { busy = false; controls(); }
  }
  for (const action of ['create','save','publish']) {
    el(action).addEventListener('click', () => { void write(action); });
  }
  window.addEventListener('message', (event) => {
    if (event.source !== window.parent || event.data?.type !== 'vibress:extension:connect' ||
      event.data.version !== 1 || port || !event.ports?.length) return;
    port = event.ports[0];
    lang = typeof event.data.locale === 'string' && event.data.locale.startsWith('ar') ? 'ar' : 'en';
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-en]').forEach(node => {
      node.textContent = node.getAttribute('data-' + lang) || '';
    });
    port.onmessage = ({ data }) => {
      if (data?.type !== 'vibress:extension:response' || data.version !== 1) return;
      const pending = waiting.get(data.requestId);
      if (!pending) return;
      waiting.delete(data.requestId);
      if (data.ok === true) pending.resolve(data.data);
      else pending.reject(new Error('denied'));
    };
    void read();
  });
  window.addEventListener('pagehide', () => {
    if (port) port.close();
    port = null;
    for (const item of waiting.values()) item.reject(new Error('closed'));
    waiting.clear();
  });
  announce(messages.en.connecting);
}());
</script></body></html>
