name: LMS Security & Compatibility

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Typecheck, lint, release artifacts and unit tests
        run: npm run verify:local
